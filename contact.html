<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Foundations | Contact</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <header class="bg-primary text-white py-4">
    <div class="container">
      <h1>Contact the Class</h1>
      <nav class="nav nav-pills" aria-label="Main navigation">
        <a class="nav-link text-white" href="index.html">Home</a>
        <a class="nav-link text-white" href="topics.html">Topics</a>
        <a class="nav-link active" href="contact.html" aria-current="page">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container py-5">
    <div class="row g-4">
      <article class="col-md-7">
        <div class="card shadow-sm">
          <div class="card-body">
            <h2 class="card-title">Ask a question</h2>
            <p>Use this simple form to practice labels, attributes, and form controls.</p>
            <form action="#" method="post">
              <div class="mb-3"><label class="form-label" for="name">Name</label><input class="form-control" id="name" name="name" type="text" required></div>
              <div class="mb-3"><label class="form-label" for="email">Email</label><input class="form-control" id="email" name="email" type="email" required></div>
              <div class="mb-3"><label class="form-label" for="message">Message</label><textarea class="form-control" id="message" name="message" rows="5"></textarea></div>
              <button class="btn btn-primary" type="submit">Send message</button>
            </form>
          </div>
        </div>
      </article>

      <section class="col-md-5">
        <div class="card shadow-sm"><div class="card-body"><h2 class="card-title">Keep exploring</h2><p>Return to the <a href="index.html">home page</a> or review the <a href="topics.html">HTML topics</a>.</p></div></div>
      </section>
    </div>
  </main>

  <footer class="bg-dark text-white text-center py-3">
    <p class="mb-0"><small>Built with basic HTML elements.</small></p>
  </footer>
</body>
</html>
