<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alumni Connect | Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-9">
        <div class="card shadow">
          <div class="row g-0">
            <aside class="col-md-5 bg-primary text-white p-4"><a class="text-white text-decoration-none" href="index.html"><strong>Alumni Connect</strong><br><small>Community directory</small></a><span class="badge text-bg-light text-primary mt-4">Join the network</span><h1 class="h2 mt-4">Make your next connection count.</h1><p>Create a profile so classmates can find you, wherever life has taken you.</p></aside>
            <section class="col-md-7 p-4"><h2>Create your profile</h2><p class="text-secondary">It takes less than two minutes to get started.</p><form action="index.html" method="get"><div class="row"><div class="col-md-6 mb-3"><label class="form-label" for="first-name">First name</label><input class="form-control" id="first-name" name="first-name" type="text" autocomplete="given-name" required></div><div class="col-md-6 mb-3"><label class="form-label" for="last-name">Last name</label><input class="form-control" id="last-name" name="last-name" type="text" autocomplete="family-name" required></div></div><div class="mb-3"><label class="form-label" for="register-email">Email address</label><input class="form-control" id="register-email" name="email" type="email" autocomplete="email" required></div><div class="row"><div class="col-md-6 mb-3"><label class="form-label" for="class-year">Graduation year</label><select class="form-select" id="class-year" name="class-year" required><option value="">Select year</option><option>2024</option><option>2023</option><option>2022</option><option>2021</option><option>2020</option></select></div><div class="col-md-6 mb-3"><label class="form-label" for="role">Current role</label><input class="form-control" id="role" name="role" type="text" required></div></div><div class="mb-3"><label class="form-label" for="new-password">Create password</label><input class="form-control" id="new-password" name="password" type="password" autocomplete="new-password" minlength="8" required></div><button class="btn btn-primary w-100" type="submit">Create alumni profile</button></form><p class="mt-3 mb-0 text-secondary">Already registered? <a href="login.html">Sign in</a></p></section>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
