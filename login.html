<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alumni Connect | Sign In</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-8">
        <div class="card shadow">
          <div class="row g-0">
            <aside class="col-md-5 bg-primary text-white p-4"><a class="text-white text-decoration-none" href="index.html"><strong>Alumni Connect</strong><br><small>Community directory</small></a><span class="badge text-bg-light text-primary mt-4">Welcome back</span><h1 class="h2 mt-4">Your community is waiting.</h1><p>Sign in to reconnect with classmates and keep your alumni profile current.</p></aside>
            <section class="col-md-7 p-4"><h2>Sign in</h2><p class="text-secondary">Use your alumni account to continue.</p><form action="index.html" method="get"><div class="mb-3"><label class="form-label" for="email">Email address</label><input class="form-control" id="email" name="email" type="email" autocomplete="email" required></div><div class="mb-3"><label class="form-label" for="password">Password</label><input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required></div><button class="btn btn-primary w-100" type="submit">Sign in to dashboard</button></form><p class="mt-3 mb-0 text-secondary">New to the network? <a href="register.html">Create an account</a></p></section>
          </div>
        </div>
      </div>
    </div>
  </main>
</body>
</html>
